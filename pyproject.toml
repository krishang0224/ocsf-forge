[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocsf-forge"
dynamic = ["version", "optional-dependencies"]
description = "Inspect and normalize security logs into OCSF-aligned events"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
ocsf-forge = "ulpf.cli:main"

[project.urls]
Repository = "https://github.com/krishang0224/ocsf-forge"
Issues = "https://github.com/krishang0224/ocsf-forge/issues"

[tool.setuptools.packages.find]
include = ["ulpf", "ulpf.*"]

[tool.setuptools.dynamic]
version = {attr = "ulpf.__version__"}

[tool.setuptools.dynamic.optional-dependencies]
lakehouse = {file = ["requirements.txt"]}
homelab = {file = ["requirements-homelab.txt"]}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
