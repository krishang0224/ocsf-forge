name: Homelab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        environment: [isolated, parity]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-homelab.txt pytest==8.4.2
      - if: matrix.environment == 'parity'
        run: python -m pip install -r requirements-dev.txt
      - name: Homelab backend and UI
        env:
          HOMELAB_ISOLATED: ${{ matrix.environment == 'isolated' && '1' || '0' }}
        run: pytest -q tests/test_duckdb_backend.py tests/test_duckdb_recovery.py tests/test_homelab_app.py tests/test_input_limits.py tests/test_parser_resource_safety.py
