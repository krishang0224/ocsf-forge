name: Homelab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        environment: [isolated, parity]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-homelab.txt pytest==8.4.2
      - if: matrix.environment == 'parity'
        run: python -m pip install -r requirements-dev.txt
      - name: Homelab backend and UI
        env:
          HOMELAB_ISOLATED: ${{ matrix.environment == 'isolated' && '1' || '0' }}
        run: pytest -q tests/test_duckdb_backend.py tests/test_homelab_app.py
