name: Bug report
description: Report a reproducible parsing, ingestion, query, or dashboard problem.
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, use [private reporting](https://github.com/krishang0224/ocsf-forge/security/advisories/new). Do not include secrets or private production logs here.
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Paste the output of git rev-parse --short HEAD, or identify the image you used.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Docker or Podman version, and enabled Compose profiles. Include relevant configuration with secrets removed.
    validations:
      required: true
  - type: input
    id: input_format
    attributes:
      label: Input format and ingestion path
      description: For example, CSV via Paste or Log4j via Kafka. Write not applicable for unrelated problems.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the commands or UI actions needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Redacted sample log or query
      description: Provide the smallest synthetic or redacted input that reproduces the issue. Preserve whitespace and escaping. Write not applicable if no input is involved.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error or unexpected output, with sensitive details removed.
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, personal data, and private production logs from this report.
          required: true
