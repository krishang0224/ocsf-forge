name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocsf-schema-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Prepare checksum-pinned official toolkit and OCSF 1.8.0 schema
        run: python -m validation.prepare_toolkit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - name: Offline official validation with exact per-fixture expectations
        run: python -m validation.check_toolkit
      - name: Prove nested regressions and wrong negative results are rejected
        env:
          ULPF_OCSF_TOOLKIT_DIRECTORY: .cache/ocsf-validator
        run: pytest -q tests/test_toolkit_gate.py
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --cov=ulpf --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Install and smoke-test packaged CLI outside checkout
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/ocsf-wheel .
          python -m venv /tmp/ocsf-package-check
          /tmp/ocsf-package-check/bin/pip install --no-deps --no-index --find-links /tmp/ocsf-wheel ocsf-forge
          cd /tmp
          /tmp/ocsf-package-check/bin/ocsf-forge demo
          /tmp/ocsf-package-check/bin/python -c 'from importlib.metadata import version; import ulpf; assert version("ocsf-forge") == ulpf.__version__'
      - name: OCSF fixture regression (known gaps, not certification)
        run: python -m validation.check_ocsf --check-baseline
      - name: Validate all Compose profiles
        run: docker compose --profile streaming --profile operations --profile detection config --quiet
